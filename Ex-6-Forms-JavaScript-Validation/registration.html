<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form | PahiranGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <h2><strong>PahiranGo</strong></h2>
            </div>
            <div class="nav-right">
                <a href="index.html">Back to Home</a>
            </div>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="form-container">
        <div class="form-wrapper">
            <h1>Create Your Account</h1>
            <p class="form-subtitle">Join PahiranGo and start shopping today!</p>

            <!-- Registration Form with JavaScript Validation -->
            <form id="registrationForm" onsubmit="handleRegistration(event)" novalidate>
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Enter your full name"
                        class="form-input"
                    >
                    <!-- Error message display for full name -->
                    <span class="error-message" id="fullNameError"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        class="form-input"
                    >
                    <!-- Error message display for email -->
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Phone Number Field -->
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="Enter your 10-digit phone number"
                        class="form-input"
                    >
                    <!-- Error message display for phone -->
                    <span class="error-message" id="phoneError"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Create a strong password"
                        class="form-input"
                    >
                    <!-- Error message display for password -->
                    <span class="error-message" id="passwordError"></span>
                    <!-- Password strength indicator -->
                    <div class="password-strength">
                        <div class="strength-meter" id="strengthMeter"></div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password"
                        class="form-input"
                    >
                    <!-- Error message display for confirm password -->
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <!-- Address Field -->
                <div class="form-group">
                    <label for="address">Address <span class="required">*</span></label>
                    <textarea 
                        id="address" 
                        name="address" 
                        placeholder="Enter your full address"
                        class="form-input"
                        rows="3"
                    ></textarea>
                    <!-- Error message display for address -->
                    <span class="error-message" id="addressError"></span>
                </div>

                <!-- City Field -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="city" 
                            name="city" 
                            placeholder="Enter your city"
                            class="form-input"
                        >
                        <!-- Error message display for city -->
                        <span class="error-message" id="cityError"></span>
                    </div>

                    <!-- Postal Code Field -->
                    <div class="form-group">
                        <label for="postalCode">Postal Code <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="postalCode" 
                            name="postalCode" 
                            placeholder="Enter postal code"
                            class="form-input"
                        >
                        <!-- Error message display for postal code -->
                        <span class="error-message" id="postalCodeError"></span>
                    </div>
                </div>

                <!-- Gender Selection -->
                <div class="form-group">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="Male"> Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="Female"> Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="Other"> Other
                        </label>
                    </div>
                    <!-- Error message display for gender -->
                    <span class="error-message" id="genderError"></span>
                </div>

                <!-- Terms and Conditions Checkbox -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms"
                        > 
                        I agree to the <a href="#" target="_blank">Terms & Conditions</a> <span class="required">*</span>
                    </label>
                    <!-- Error message display for terms -->
                    <span class="error-message" id="termsError"></span>
                </div>

                <!-- Newsletter Subscription Checkbox -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input 
                            type="checkbox" 
                            id="newsletter" 
                            name="newsletter"
                        > 
                        Subscribe to our newsletter for exclusive offers
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Create Account</button>

                <!-- Form Success/Error Messages -->
                <div id="successMessage" class="success-message" style="display: none;">
                    ✓ Registration successful! Redirecting to login...
                </div>
                <div id="generalError" class="error-message" style="display: block; margin-top: 15px;"></div>

                <!-- Already have account link -->
                <p class="form-footer">
                    Already have an account? <a href="login.html">Sign In here</a>
                </p>
            </form>
        </div>
    </div>

    <!-- JavaScript Validation Script -->
    <script src="validation.js"></script>

</body>
</html>

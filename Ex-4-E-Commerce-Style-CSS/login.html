<!DOCTYPE html>
<html>
<head>
    <title>Login | PahiranGo</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-error { color: #dc2626; font-size: 0.9em; margin-top: 4px; display: block; }
        .form-success { color: #10b981; font-weight: 600; text-align: center; padding: 12px; background: #ecfdf5; border-radius: 6px; margin-bottom: 15px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .login-box { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); max-width: 400px; margin: 40px auto; }
        .login-box h2 { margin-bottom: 25px; text-align: center; }
        .login-btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .login-btn:hover { background: #764ba2; }
        .login-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- NAVBAR (keep same as other pages) -->
<header class="site-header">
  <div class="navbar">

    <!-- LEFT -->
    <div class="nav-left">
      <a href="index.html" class="logo">
        <img src="images/logo-dark.png" alt="PahiranGo">
      </a>

      <nav class="nav-links">
        <a href="index.html">Shop</a>
        <a href="women.html">Women</a>
        <a href="men.html">Men</a>
        <a href="cosmetics.html">Cosmetics</a>
      </nav>
    </div>

    <!-- RIGHT -->
    <div class="nav-right">

      <div class="search-container">
        <input type="text" placeholder="Search Product">
        <button>🔍</button>
      </div>

      <a href="cart.html" class="cart">
        🛒 <span>Cart</span>
      </a>

      <a href="login.html" class="login">
        👤 <span>Login</span>
      </a>

      <select class="language">
        <option>EN🌐</option>
        <option>NE🌐</option>
      </select>

    </div>
  </div>
</header>


<!-- LOGIN SECTION -->

<main class="login-section">

    <div class="login-box">
        <h2>Login to Your Account</h2>

        <form id="loginForm">
            <div id="successMessage" class="form-success" style="display:none;"></div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
                <span class="form-error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <span class="form-error" id="passwordError"></span>
            </div>

            <p class="terms">
                By continuing, you agree to PahiranGo's Terms of Use and Privacy Policy.
            </p>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>

            <p class="new-account">
                New to PahiranGo? <a href="register.html">Create an account</a>
            </p>
        </form>
    </div>

</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Clear previous errors
        document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
        document.getElementById('successMessage').style.display = 'none';
        
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';
        
        const formData = new FormData(e.target);
        formData.append('formType', 'login');
        
        try {
            const response = await fetch('http://aaryansah.my-style.in/pahirango/process_ecommerce_forms.php', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('successMessage').textContent = '✓ ' + data.message;
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                for (const [field, message] of Object.entries(data.errors)) {
                    const errorEl = document.getElementById(field + 'Error');
                    if (errorEl) errorEl.textContent = '❌ ' + message;
                }
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    });
</script>

</body>

</html>
